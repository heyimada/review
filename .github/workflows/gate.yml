name: Merge gate

# Posts the gate check run (as the review App) with its decision for the pull request's head commit. When the change
# qualifies, the App approves that commit and enables auto-merge; otherwise a person has to approve. Never checks out
# the pull request's code.
#
# The caller runs it on pull_request_target and on workflow_run when its review, review trigger or CI workflow
# completes. workflow_run carries no pull request for forks, so gate.ts finds the pull request by head commit. The
# caller's job needs contents: read, pull-requests: read, checks: read and id-token: write.
on:
  workflow_call:
    # Read from the review and fix environments of the calling repository, which the jobs below name. The caller passes
    # nothing: secrets: inherit doesn't cross account owners.
    secrets:
      REVIEW_APP_PRIVATE_KEY:
        required: false

permissions: {}

env:
  BUN_VERSION: 1.4.0

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: review
    permissions:
      contents: read
      pull-requests: read
      checks: read
      id-token: write
    steps:
      # The engine commit the caller pinned; see review.yml.
      - id: engine
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=review-engine" | jq -r .value)
          payload=$(cut -d. -f2 <<<"$token" | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          claims=$(base64 -d <<<"$payload")
          ref=$(jq -r .job_workflow_ref <<<"$claims")
          sha=$(jq -r .job_workflow_sha <<<"$claims")
          repo=${ref%%/.github/workflows/*}
          [[ "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ && "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::can't tell which engine commit this is"; exit 1; }
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.engine.outputs.repo }}
          ref: ${{ steps.engine.outputs.sha }}
          path: engine
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repo
          sparse-checkout: .github
          persist-credentials: false
      # Pinned because later steps in this job hold the App key; Dependabot bumps it.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Pinned because this step holds the App's private key; Dependabot bumps it.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          permission-checks: write
          # Approving, enabling auto-merge and merging. Merges by the App start the push CI on main, unlike GITHUB_TOKEN's.
          permission-pull-requests: write
          permission-contents: write
      # gate.ts only uses Bun built-ins, so there is nothing to install.
      - run: |
          if [ -n "$PR" ]; then
            bun engine/src/gate.ts --pr "$PR"
          else
            bun engine/src/gate.ts --sha "$SHA"
          fi
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REVIEW_CONFIG: repo/.github/review.json
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_APP_TOKEN: ${{ steps.app.outputs.token }}
          REVIEW_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
