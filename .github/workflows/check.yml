name: Review config

# Checks the pull request's .github/review.json, and that .github/CODEOWNERS covers every sensitive path, so a broken
# config can't reach the default branch, where it would stop every review and gate run. Holds no secrets: the engine
# only reads the two files. Called from the repository's CI on pull_request; the caller's job needs contents: read and
# id-token: write. Pull requests from forks skip it, since they get no OIDC token, and the gate sends them to a
# person anyway.
on:
  workflow_call:

permissions: {}

jobs:
  check:
    name: Check
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      # The engine commit the caller pinned; see review.yml.
      - id: engine
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=review-engine" | jq -r .value)
          payload=$(cut -d. -f2 <<<"$token" | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          claims=$(base64 -d <<<"$payload")
          ref=$(jq -r .job_workflow_ref <<<"$claims")
          sha=$(jq -r .job_workflow_sha <<<"$claims")
          repo=${ref%%/.github/workflows/*}
          [[ "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ && "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::can't tell which engine commit this is"; exit 1; }
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.engine.outputs.repo }}
          ref: ${{ steps.engine.outputs.sha }}
          path: engine
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: repo
          sparse-checkout: .github
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      # config.ts only uses Bun built-ins, so there is nothing to install.
      - run: bun engine/src/config.ts
        env:
          REVIEW_CONFIG: repo/.github/review.json
