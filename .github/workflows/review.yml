name: Review

# Bug and security review of a pull request, posted by the review GitHub App. Called from the reviewed repository's own
# workflow on pull_request_target, so the engine, its settings and the secrets come from trusted refs and a pull request
# can't change its own reviewer:
#
# - the engine is this repository at the commit the caller pinned in `uses:`
# - the settings are .github/review.json on the reviewed repository's default branch
# - the pull request's code is checked out into pr/ as data: it is never installed, built or run, and the review agents
#   can only read files there
#
# Only collaborators with write access get an AI review; the gate sends everyone else to a human. The caller's job needs
# contents: read, pull-requests: read and id-token: write, and the review environment holds REVIEW_APP_CLIENT_ID (a
# variable), REVIEW_APP_PRIVATE_KEY and CLAUDE_CODE_OAUTH_TOKEN.
on:
  workflow_call:

permissions: {}

env:
  BUN_VERSION: 1.4.0

jobs:
  trust:
    name: Trust
    if: ${{ github.event_name == 'pull_request_target' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: review
    permissions:
      id-token: write
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
      engine-repo: ${{ steps.engine.outputs.repo }}
      engine-sha: ${{ steps.engine.outputs.sha }}
    steps:
      # A reusable workflow isn't told which commit of its own repository it runs from; the OIDC token's job_workflow_ref
      # and job_workflow_sha claims are. Without them the job fails instead of reviewing with some other engine.
      - id: engine
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=review-engine" | jq -r .value)
          payload=$(cut -d. -f2 <<<"$token" | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          claims=$(base64 -d <<<"$payload")
          ref=$(jq -r .job_workflow_ref <<<"$claims")
          sha=$(jq -r .job_workflow_sha <<<"$claims")
          repo=${ref%%/.github/workflows/*}
          [[ "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ && "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::can't tell which engine commit this is"; exit 1; }
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # The permission lookup goes through the App, whose token is verified to read it; GITHUB_TOKEN with no
      # permissions isn't verified to.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          permission-pull-requests: read
      # The author's live permission, not who pushed last. Bots and forks are never trusted.
      - id: check
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          trusted=false
          if [ "$AUTHOR_TYPE" = User ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            # No fallback: if the lookup fails, the job fails visibly instead of quietly skipping every review.
            permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .permission)
            case "$permission" in admin | maintain | write) trusted=true ;; esac
          fi
          echo "trusted=$trusted" >> "$GITHUB_OUTPUT"

  review:
    name: ${{ matrix.lens }}
    needs: trust
    if: ${{ needs.trust.outputs.trusted == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: review
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      # One after the other, so the security review sees what the bugs review posted and its voters can drop the same
      # problem reworded. Two parallel reviews posted the same bug twice.
      max-parallel: 1
      matrix:
        lens: [bugs, security]
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.trust.outputs.engine-repo }}
          ref: ${{ needs.trust.outputs.engine-sha }}
          path: engine
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repo
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      # A symlink could point the agents' file tools outside pr/. review.ts also refuses to run if one is left.
      - run: find pr -type l -delete
      # Pinned because later steps in this job hold the App key or the Claude token; Dependabot bumps it.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --cwd engine --frozen-lockfile --ignore-scripts
      # Pinned because this step holds the App's private key; Dependabot bumps it.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          # resolveReviewThread is refused without contents: write, even with pull-requests: write. The agents never see
          # this token; only review.ts uses it.
          permission-contents: write
          permission-pull-requests: write
      - run: bun engine/src/review.ts --pr "$PR" --lens "$LENS"
        env:
          PR: ${{ github.event.pull_request.number }}
          LENS: ${{ matrix.lens }}
          REVIEW_CONFIG: repo/.github/review.json
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_APP_TOKEN: ${{ steps.app.outputs.token }}
          REVIEW_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
