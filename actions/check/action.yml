name: Review config
description: Checks the checked-out commit's .github/review.json, and that .github/CODEOWNERS covers every sensitive path, so a broken config can't reach the default branch. Holds no secrets.
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        path: repo
        sparse-checkout: .github
        persist-credentials: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.0
    # config.ts only uses Bun built-ins, so there is nothing to install.
    - shell: bash
      run: bun "$GITHUB_ACTION_PATH/../../src/config.ts"
      env:
        REVIEW_CONFIG: repo/.github/review.json
