name: Merge gate
description: Posts the gate check for a pull request's head commit as the review App, and approves and merges it when it qualifies. Never checks out the pull request's code.
inputs:
  client-id:
    description: The review App's client ID.
    required: true
  private-key:
    description: The review App's private key. Pass it from the caller job's review environment.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: repo
        sparse-checkout: .github
        persist-credentials: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.0
    - id: app
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        permission-checks: write
        # Approving, enabling auto-merge and merging. Merges by the App start the push CI on main, unlike GITHUB_TOKEN's.
        permission-pull-requests: write
        permission-contents: write
    # gate.ts only uses Bun built-ins, so there is nothing to install. workflow_run carries no pull request for forks,
    # so then it finds the pull request by head commit.
    - shell: bash
      run: |
        if [ -n "$PR" ]; then
          bun "$GITHUB_ACTION_PATH/../../src/gate.ts" --pr "$PR"
        else
          bun "$GITHUB_ACTION_PATH/../../src/gate.ts" --sha "$SHA"
        fi
      env:
        PR: ${{ github.event.pull_request.number }}
        SHA: ${{ github.event.workflow_run.head_sha }}
        REVIEW_CONFIG: repo/.github/review.json
        GITHUB_TOKEN: ${{ github.token }}
        REVIEW_APP_TOKEN: ${{ steps.app.outputs.token }}
        REVIEW_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
